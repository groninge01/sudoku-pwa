<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="A clean, offline-first sudoku game. No ads, no rewards, no limits." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f19" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      /* pre-CSS background so reload never flashes white */
      html { background: #f1f5f9; }
      html[data-theme='dark'] { background: #0b0f19; }
      @media (prefers-color-scheme: dark) {
        html[data-theme='system'] { background: #0b0f19; }
      }
    </style>
    <script>
      /* apply the saved theme before first paint */
      try {
        var t = JSON.parse(localStorage.getItem('sudoku:settings') || '{}').theme;
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t : 'system';
      } catch (e) {
        document.documentElement.dataset.theme = 'system';
      }
    </script>
    <title>Sudoku</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
